    <!-- canonical + og:url are set per-route via react-helmet-async (src/components/SEO.tsx) -->

    <!-- JSON-LD Structured Data (honest — no fake ratings) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "CLAUTHOR",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web",
      "url": "https://clauthor.com/",
      "description": "AI workforce platform with 225 autonomous agents across 20 corporate departments.",
      "offers": {
        "@type": "Offer",
        "price": "59",
        "priceCurrency": "USD",
        "description": "Starter plan from $59/month"
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "CLAUTHOR",
      "url": "https://clauthor.com/",
      "logo": "https://clauthor-com.lovable.app/favicon.png"
    }
    </script>

    <!-- Preconnect to critical origins -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://api.clauthor.com" />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
